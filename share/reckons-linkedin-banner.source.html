<!-- Reckons.AI LinkedIn profile banner - source of the PNG beside this file.
     Size: 1584x396 (LinkedIn personal profile cover, 4:1). @2x is the same at 3168x792.
     Content is kept right of x=408 so the profile photo, which overlaps the lower left
     on desktop, never sits on top of it.
     Regenerate: open this file in a browser and screenshot at 1584x396, or run Playwright
     against it with deviceScaleFactor 1 and 2. Fonts and logo resolve relatively from static/. -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Bespoke Stencil';src:url('../static/fonts/bespoke-stencil/BespokeStencil-Variable.woff2') format('woff2');font-weight:100 900;font-display:block;}
@font-face{font-family:'Supreme';src:url('../static/fonts/supreme/Supreme-Variable.woff2') format('woff2');font-weight:100 900;font-display:block;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;overflow:hidden}
.banner{position:relative;width:1584px;height:396px;background:#0a0f14;
  background-image:radial-gradient(1000px 560px at 16% 112%, #0f4a54 0%, rgba(10,15,20,0) 60%),
                   radial-gradient(880px 500px at 92% -12%, #1a9b8e24 0%, rgba(10,15,20,0) 58%);
  font-family:'Supreme',system-ui,sans-serif;overflow:hidden}
.mesh{position:absolute;inset:0}
.row{position:absolute;left:408px;right:56px;top:0;height:396px;display:flex;align-items:center;gap:40px}
.logo{width:188px;height:auto;flex:0 0 188px}
.rule{flex:0 0 1px;align-self:stretch;margin:104px 0;background:linear-gradient(#2a3a4d00,#2a3a4d,#2a3a4d00)}
.text{display:flex;flex-direction:column;gap:13px;min-width:0}
.kicker{font-size:14.5px;letter-spacing:.3em;color:#1a9b8e;font-weight:600}
h1{font-family:'Bespoke Stencil';font-weight:700;font-size:47px;line-height:1.08;color:#e8f0f5}
h1 em{font-style:normal;color:#1a9b8e}
.sub{font-size:18px;line-height:1.45;color:#b8c5d4;max-width:760px}
.meta{display:flex;align-items:center;gap:13px;font-size:15px;color:#7a8a9d}
.meta .dot{width:4px;height:4px;border-radius:50%;background:#2a3a4d;flex:0 0 4px}
.meta .url{color:#1a9b8e;font-weight:600}
</style></head><body>
<div class="banner">
  <svg class="mesh" width="1584" height="396" viewBox="0 0 1584 396" fill="none">
    <g stroke="#1a9b8e" stroke-opacity="0.20" stroke-width="1.15">
      <path d="M118 232 L232 138"/><path d="M232 138 L322 232"/><path d="M118 232 L322 232"/>
      <path d="M232 138 L206 54"/><path d="M118 232 L92 330"/><path d="M322 232 L350 122"/>
      <path d="M1424 112 L1516 190"/><path d="M1516 190 L1452 296"/><path d="M1424 112 L1452 296"/>
    </g>
    <g fill="#0a0f14" stroke="#1a9b8e" stroke-opacity="0.55" stroke-width="1.5">
      <circle cx="232" cy="138" r="9"/><circle cx="322" cy="232" r="7"/>
      <circle cx="118" cy="232" r="10.5"/><circle cx="1516" cy="190" r="8"/><circle cx="1424" cy="112" r="6"/>
    </g>
    <g fill="#6b4399" fill-opacity="0.75">
      <circle cx="206" cy="54" r="4.5"/><circle cx="92" cy="330" r="4"/>
      <circle cx="350" cy="122" r="3.5"/><circle cx="1452" cy="296" r="5"/>
    </g>
  </svg>
  <div class="row">
    <img class="logo" src="../static/svg/logo-text.svg" alt="Reckons.AI"/>
    <div class="rule"></div>
    <div class="text">
      <div class="kicker">knowledge graphs · local-first · open source</div>
      <h1>Enterprise technology<br/><em>without the subscription.</em></h1>
      <p class="sub">A notes app that turns what you write or say into facts you can question later, each one still attached to where it came from.</p>
      <div class="meta"><span>MIT licensed</span><span class="dot"></span><span>Works offline</span><span class="dot"></span><span>No account</span><span class="dot"></span><span class="url">reckons.ai</span></div>
    </div>
  </div>
</div></body></html>
