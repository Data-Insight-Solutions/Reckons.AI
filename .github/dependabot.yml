version: 2
# target-branch: dev on every entry. Without it Dependabot opens PRs against the default branch,
# main, which deploys on push, so every update bypassed dev -> staging -> main and had to be
# retargeted by hand (nine on 2026-09-10, seven more open on 2026-09-29).
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Held 2026-11-04: @huggingface/transformers 4.3.x ships ort-wasm-simd-threaded.asyncify.wasm at
    # 25.6 MiB, over Cloudflare Pages' 25 MiB per-file limit, so the host-size gate fails the build
    # (#562). Lift when a release ships the wasm under the limit, or when we host it elsewhere.
    ignore:
      - dependency-name: "@huggingface/transformers"
        versions: [">=4.3.0"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: npm
    directory: /mcp-server
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /cli
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
