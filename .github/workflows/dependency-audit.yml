name: Dependency audit

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependencies (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ['.', mcp-server, cli]
    steps:
      - uses: actions/checkout@v7
      # Scheduled workflows run from the default branch; audit the integration
      # branch too, where the next release's dependencies are maintained.
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
        with:
          ref: dev
          path: integration
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Gate at MODERATE (Matt, 2026-10-28). It was --audit-level=low until seven low advisories
      # (@sveltejs/kit, deepmerge) appeared that only a SvelteKit 3 major upgrade fixes, blocking
      # every PR. Lows are still printed here and in npm run security:dependencies; they do not block.
      # Named, dated exceptions (Matt, 2026-11-17): .github/audit-exceptions.json accepts ONE advisory on
      # ONE package until a date, with a written reason; everything else still blocks at moderate, and
      # an npm error report fails the gate. See scripts/offline/audit-gate.mjs.
      - name: Audit locked production and development dependencies
        working-directory: ${{ matrix.project }}
        run: |
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit.json" || true
          node "$GITHUB_WORKSPACE/scripts/offline/audit-gate.mjs" --level=moderate \
            --exceptions="$GITHUB_WORKSPACE/.github/audit-exceptions.json" < "$RUNNER_TEMP/audit.json"
      - name: Audit scheduled integration dependencies
        if: github.event_name == 'schedule' && !cancelled()
        working-directory: integration/${{ matrix.project }}
        run: |
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit-integration.json" || true
          node "$GITHUB_WORKSPACE/integration/scripts/offline/audit-gate.mjs" --level=moderate \
            --exceptions="$GITHUB_WORKSPACE/integration/.github/audit-exceptions.json" < "$RUNNER_TEMP/audit-integration.json"
