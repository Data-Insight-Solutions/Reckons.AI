<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/svg/favicon.svg" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/png/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- CSP: script-src 'self' + wasm-unsafe-eval (ONNX/transformers.js); worker-src blob: (SW + embedding workers);
		     connect-src lists every provider the browser calls directly; object/base/form locked down.
		     Fonts are self-hosted in static/fonts/ — no external font requests.
		     TWO cloudflareinsights HOSTS ARE REQUIRED AND THEY ARE NOT THE SAME ONE. Cloudflare
		     INJECTS the Web Analytics beacon at the edge (verified in a real browser on production
		     2026-09-22: a module script with our site token, integrity hash and spa:2 — it is NOT in
		     this file and must not be added here, or it double-counts). That script is FETCHED from
		     static.cloudflareinsights.com, which script-src allows, and then POSTS its measurements to
		     cloudflareinsights.com/cdn-cgi/rum — no 'static.' prefix — which connect-src did NOT list.
		     So the beacon loaded and every report it sent was blocked by our own policy, which looks
		     exactly like having no analytics at all. Caught by the E2E console-error assertion in
		     tests/e2e/app.test.ts, not by reading the policy. NOTE that curl cannot see any of this:
		     edge injection only fires for browser requests, so `curl | grep beacon` returns nothing on
		     a site where the beacon is present and working. It was blocked by this policy
		     from launch until 2026-09-18, so the beacon failed on every visit and the project had no
		     traffic data at all during the first LinkedIn push. A blocked analytics script fails
		     silently apart from one console line —
		     the only symptom is a dashboard that reads zero, which looks like no traffic rather
		     than like a bug. It needs BOTH script-src (to load) and connect-src (to report).
		     ADDING A fetch() TO A NEW HOST MEANS ADDING IT HERE TOO, or the request is refused
		     before it is sent and the feature fails with a bare "Failed to fetch". Four were
		     missing until 2026-08-13, measured by loading this exact policy in Chromium:
		       api.github.com    — repo ingest (F14) + site export (F27). Absent since the initial
		                           release commit, so BOTH shipped features had only ever worked
		                           from Node, where CSP is not enforced.
		       api.tavily.com    — web search (auto-analyze, source-validation).
		       api.firecrawl.dev — page scrape (URL ingest upgrade, source-refresh).
		       api.reckons.ai    — the reckons provider's DEFAULT baseUrl. The substitution below
		                           only adds origins from configured env vars, never code defaults,
		                           so the default path was blocked and only an explicitly
		                           configured build worked.
		     These are fixed global service origins, so they belong in the literal policy; only
		     PER-USER self-hosted origins need the substitution mechanism below.
		     %RECKONS_EXTRA_CONNECT_SRC% is replaced by src/hooks.server.ts (NOT a Vite plugin —
		     app.html is SvelteKit's template, so transformIndexHtml never runs on it) with the
		     SELF-HOSTED origins this build is configured for (Indico, n8n,
		     a non-localhost Ollama, VITE_EXTRA_CONNECT_SRC). Those URLs are per-user and cannot be
		     listed here, and a <meta> CSP can never be widened at runtime — so without that
		     substitution every bring-your-own-server integration is blocked by the browser before
		     the app sees it. Honest limit: this only helps builds that KNOW the origin (local dev
		     and self-hosters). On the shared hosted build a user's own server is still unreachable,
		     and passing CSP is only half — the server must also send Access-Control-Allow-Origin. -->
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob: https://storage.googleapis.com https://accounts.google.com https://cdn.jsdelivr.net https://static.cloudflareinsights.com; worker-src 'self' blob:; connect-src 'self' data: blob: https://static.cloudflareinsights.com https://cloudflareinsights.com https://api.anthropic.com https://api.openai.com https://api.mistral.ai https://generativelanguage.googleapis.com https://openrouter.ai https://api.meshy.ai https://www.googleapis.com https://api.hume.ai wss://api.hume.ai https://accounts.google.com https://api.github.com https://api.tavily.com https://api.firecrawl.dev https://api.reckons.ai https://r.jina.ai https://corsproxy.io https://huggingface.co https://*.huggingface.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.huggingface.co https://*.xethub.hf.co https://*.aws.cdn.hf.co https://cdn.jsdelivr.net http://localhost:* ws://localhost:* %RECKONS_EXTRA_CONNECT_SRC%; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" />
		<title>Reckons.AI</title>
		<meta name="description" content="Reckons.AI — the semantic understanding knowledge graph that you review and automatically edit, compare, and share." />
		<meta property="og:title" content="Reckons.AI" />
		<meta property="og:description" content="The semantic understanding knowledge graph that you review and automatically edit, compare, and share." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://reckons.ai" />
		<meta property="og:image" content="https://reckons.ai/social-preview.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Reckons.AI" />
		<meta name="twitter:description" content="The semantic understanding knowledge graph that you review and automatically edit, compare, and share." />
		<meta name="twitter:image" content="https://reckons.ai/social-preview.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
