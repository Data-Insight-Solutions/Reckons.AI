<!doctype html><meta charset="utf-8"><title>control: airy</title>
<!-- DELIBERATELY GOOD. The known-good anchor: one focal point, generous
     whitespace, 18px text at high contrast, a single accent, one primary action. -->
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1417;
       color:#e8eef1;font:18px/1.6 system-ui,sans-serif;}
  main{max-width:34rem;text-align:center;padding:2rem}
  h1{font-size:2.6rem;line-height:1.15;margin:0 0 1.5rem;font-weight:600}
  p{color:#9fb0b8;margin:0 0 2.5rem}
  a{display:inline-block;background:#2dd4bf;color:#06231f;text-decoration:none;
    font-weight:600;padding:.9rem 2rem;border-radius:.5rem}
</style>
<main>
  <h1>One clear thing to do</h1>
  <p>A single sentence of supporting context, and nothing else competing with it.</p>
  <a href="#">Get started</a>
</main>
